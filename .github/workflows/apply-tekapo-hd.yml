name: Apply Tekapo HD image

on:
  push:
    paths:
      - '.github/workflows/apply-tekapo-hd.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Point D2 photo to the 1200x900 q90 WebP asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          repl = '<img src="assets/tekapo-accommodation.webp?v=1200-q90" alt="特卡波湖住宿露台与山景" loading="lazy">'

          patterns = [
              r'<img src="data:image/webp;base64,[^"]+" alt="特卡波湖住宿露台与山景" loading="lazy">',
              r'<img src="assets/tekapo-accommodation\.webp(?:\?[^"]*)?" alt="特卡波湖住宿露台与山景" loading="lazy">'
          ]

          changed = False
          for pat in patterns:
              s2, n = re.subn(pat, repl, s, count=1)
              if n:
                  s = s2
                  changed = True
                  break

          if not changed:
              raise SystemExit("Tekapo accommodation image element not found")

          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit the page update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use 1200x900 q90 Tekapo accommodation image"
          git push origin main
